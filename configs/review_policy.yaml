# Review policy: generated by `triggermap calibrate`; edit triggers by hand if needed.
# Thresholds are chosen on the dev calibration half, never on test.
version: review-policy-0
model_id: uncalibrated
calibration:
  method: identity
accept_threshold: null
target_precision: 0.95
min_coverage: 0.5
measured: {}
triggers:
  roles:
  - EXCEPTION
  - NOT_REQUIRED
  - UNCERTAIN
  negation_words:
  - not
  - 'no'
  - never
  - without
  - unless
  - except
  - regardless
  - even
  - n't
  - neither
  - nor
  - unauthenticated
  - unaffected
  negation_window_words: 3
  workaround_sections: true
