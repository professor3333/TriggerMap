# Ablations and learning curve for DeBERTa-v3-small, one factor at a time, three seeds each.
# The recipe is the best grid cell of neural run 3 (sqrt span-tag weights, 5e-5, up to 20
# epochs, no early stop before epoch 6). Run it on a GPU:
#   CONFIGS="ablations" bash scripts/gpu/run_neural.sh

[train]
model_id = "ablation-1"
base_model = "microsoft/deberta-v3-small"
revision = "a36c739020e01763fe789b4b85e2df55d6180012"
max_length = 512
stride = 64
context_tokens = 48
use_context = true
group_loss_weight = 1.0
bio_weighting = "sqrt"
learning_rate = 5e-5
epochs = 20
batch_size = 8
gradient_accumulation = 2
warmup_ratio = 0.1
weight_decay = 0.01
patience = 3
min_epochs = 6
device = "auto"
mlflow_experiment = "triggermap-ablations"

[grid]
seed = [0, 1, 2]

[[runs]]
name = "full"

[[runs]]
name = "no-context"       # heading/list context removed
use_context = false

[[runs]]
name = "no-group"         # group objective removed
group_loss_weight = 0.0

[[runs]]
name = "docs-60"          # learning curve (the train split has 239 documents)
max_train_documents = 60

[[runs]]
name = "docs-120"
max_train_documents = 120
