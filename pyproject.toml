[project]
name = "triggermap"
version = "0.1.0"
description = "Extract vulnerability prerequisites and exceptions from Python security advisories into evidence-linked exposure checklists."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1.6,<4",
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
]

[project.scripts]
triggermap = "triggermap.cli:main"

[project.optional-dependencies]
baselines = [
    "en-core-web-sm",
    "python-crfsuite==0.9.12",
    "scikit-learn>=1.9,<1.10",
    "spacy>=3.8.16,<3.9",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triggermap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists via str.split() read better than long literals

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: needs network, GPU, or large data; excluded from CI",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = ["pycrfsuite", "sklearn.*", "joblib"]
ignore_missing_imports = true
