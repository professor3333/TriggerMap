# TriggerMap on one CPU host. The active release (image + model bundle + review policy) is
# chosen by deploy/releases/current and deploy/releases/.env, written by `triggermap release`.
#
#   docker compose -f deploy/compose.yaml --env-file deploy/releases/.env up -d
#   docker compose -f deploy/compose.yaml --env-file deploy/releases/.env run --rm refresh

name: triggermap

services:
  app:
    image: ${TRIGGERMAP_IMAGE:?activate a release first (triggermap release activate)}
    build:
      context: ..
      args:
        EXTRAS: ${TRIGGERMAP_EXTRAS:-serve}
    environment:
      TRIGGERMAP_RELEASE_DIR: /release
      TRIGGERMAP_DATABASE: /data/triggermap.db
    volumes:
      - app-data:/data
      - ./releases/current/:/release:ro
    ports:
      - "127.0.0.1:${TRIGGERMAP_HOST_PORT:-8000}:8000"   # loopback only: for `app verify`
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # On-demand ingestion: refresh the pinned snapshot and reload advisories into the app DB.
  # Schedule it from the host, e.g. a daily cron entry running `... run --rm refresh`.
  refresh:
    image: ${TRIGGERMAP_IMAGE}
    profiles: ["jobs"]
    environment:
      SNAPSHOT_COMMIT: ${SNAPSHOT_COMMIT:-}
    working_dir: /work
    entrypoint: ["sh", "-c"]
    command:
      - >-
        triggermap ingest fetch --dest /work/snapshot ${SNAPSHOT_COMMIT:+--commit $SNAPSHOT_COMMIT} &&
        triggermap ingest build --snapshot /work/snapshot --out /work/processed --manifest /work/manifest.json &&
        triggermap app sync --processed /work/processed --database /data/triggermap.db
    volumes:
      - app-data:/data
      - snapshot:/work

  proxy:
    image: caddy:2.11.7-alpine
    depends_on: [app]
    ports:
      - "${TRIGGERMAP_HTTP_PORT:-80}:80"
      - "${TRIGGERMAP_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    depends_on: [app]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped

volumes:
  app-data:
  snapshot:
  caddy-data:
  prometheus-data:
