name: release

# On a version tag: test, build the serving image, smoke-test it, push it to GHCR and
# publish a GitHub release whose manifest records the image digest.
# Model promotion (evaluation, calibration and performance gates against the declared
# targets) is a separate step once targets exist; see docs/deployment.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --extra baselines --extra neural --extra serve --extra onnx --extra export
      - name: Lint, types and tests
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy src/
          uv run pytest -m "not slow"
      - name: Build image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/triggermap:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${OWNER}/triggermap:${GITHUB_REF_NAME}" .
      - name: Container smoke test
        run: deploy/smoke.sh "$IMAGE"
      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "git_sha": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE"],
              "image_digest": os.environ["DIGEST"],
          }
          open("release-image.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY
          gh release create "$GITHUB_REF_NAME" release-image.json --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Serving image: \`$DIGEST\`. Deploy with \`triggermap release create\` (see docs/deployment.md)."
