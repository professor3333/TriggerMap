name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --extra baselines --extra neural --extra serve --extra onnx --extra export
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy src/
      - name: Tests
        run: uv run pytest -m "not slow"
      - name: Validate compose file
        run: TRIGGERMAP_IMAGE=triggermap:ci docker compose -f deploy/compose.yaml config --quiet
      - name: Build image
        run: TRIGGERMAP_IMAGE=triggermap:ci docker compose -f deploy/compose.yaml build app
      - name: Container smoke test
        run: deploy/smoke.sh triggermap:ci
